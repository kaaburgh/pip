name: issue-12999 focused tests

on:
  push:
    branches:
      - issue-12999-implementation

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: python -m pip install nox
      - name: Run focused issue 12999 tests
        run: >-
          python -m nox -s test-3.13 --
          tests/unit/test_finder.py::TestLinkEvaluator::test_evaluate_link__format_control
          tests/unit/test_finder.py::test_format_control_recheck_keeps_other_candidate_filters
          tests/functional/test_new_resolver_errors.py
          --verbose --showlocals
